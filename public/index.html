<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kochbuch</title>
  <meta name="theme-color" content="#2f7d4f">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/" class="logo"><img class="logo-mark" src="logo.svg" alt=""><span>Kochbuch</span></a>
      <nav class="nav" id="nav" hidden>
        <a href="#/" class="nav-link hide-sm">Rezepte</a>
        <a href="#/kalender" class="nav-link" title="Kalender"><svg viewBox="0 0 24 24" class="ic"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg> <span class="hide-sm">Kalender</span></a>
        <button class="nav-link" id="btn-random" title="Zufälliges Rezept"><svg class="ic-dice" viewBox="0 0 64 64" aria-hidden="true"><g stroke="#1c2340" stroke-width="4" stroke-linejoin="round"><path d="M32 5 57 18 32 31 7 18Z" fill="#f3f5f7"/><path d="M7 18 32 31V59L7 46Z" fill="#dde2e6"/><path d="M57 18 32 31V59L57 46Z" fill="#b6bec4"/></g><g fill="#1c2340"><ellipse cx="32" cy="18" rx="4.6" ry="2.6"/><ellipse cx="14" cy="27.5" rx="2.4" ry="3.2"/><ellipse cx="26" cy="34" rx="2.4" ry="3.2"/><ellipse cx="20" cy="37.5" rx="2.4" ry="3.2"/><ellipse cx="14" cy="41.5" rx="2.4" ry="3.2"/><ellipse cx="26" cy="48" rx="2.4" ry="3.2"/><ellipse cx="50" cy="27.5" rx="2.4" ry="3.2"/><ellipse cx="44" cy="37.5" rx="2.4" ry="3.2"/><ellipse cx="38" cy="48" rx="2.4" ry="3.2"/></g></svg> <span class="hide-sm">Zufall</span></button>
        <a href="#/neu" class="btn btn-primary">+ <span class="hide-sm">Neues Rezept</span></a>
        <div class="user-menu">
          <button class="nav-link user-btn" id="btn-user" aria-haspopup="true" aria-expanded="false" aria-label="Benutzermenü">
            <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
            <span class="user-name hide-sm" id="user-name"></span>
            <span class="user-badge" id="user-badge" hidden></span>
            <svg viewBox="0 0 24 24" class="ic ic-sm"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="menu" id="user-menu" hidden>
            <a href="#/kategorien" class="menu-item"><svg viewBox="0 0 24 24" class="ic"><path d="M4 6h16M4 12h16M4 18h10"/></svg> Kategorien verwalten</a>
            <a href="#/gruppen" class="menu-item"><svg viewBox="0 0 24 24" class="ic"><circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><path d="M2.5 19a5.5 5.5 0 0 1 11 0M10.5 19a5.5 5.5 0 0 1 11 0"/></svg> Gruppen <span class="count-badge" id="menu-groups-badge" hidden></span></a>
            <a href="#/einkaufslisten" class="menu-item"><svg viewBox="0 0 24 24" class="ic"><path d="M3 4h2.5l2.2 10.5a1.5 1.5 0 0 0 1.5 1.2h8.3a1.5 1.5 0 0 0 1.5-1.1L21 8H6.3"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg> Einkaufslisten</a>
            <a href="#/ausgeblendet" class="menu-item"><svg viewBox="0 0 24 24" class="ic"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c5 0 9 4.5 10 7-.4 1-1.3 2.4-2.6 3.8M6.6 6.6C4.4 8 2.8 10.2 2 12c1 2.5 5 7 10 7 1.9 0 3.6-.6 5.1-1.5"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg> Ausgeblendete Rezepte</a>
            <a href="#/benutzer" class="menu-item" id="menu-users" hidden><svg viewBox="0 0 24 24" class="ic"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/></svg> Benutzer <span class="count-badge" id="menu-users-badge" hidden></span></a>
            <div class="menu-storage" id="menu-storage" hidden></div>
            <button class="menu-item" id="btn-logout"><svg viewBox="0 0 24 24" class="ic"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l5-5-5-5M15 12H4"/></svg> Abmelden</button>
          </div>
        </div>
      </nav>
    </div>
  </header>
  <main id="app"><div class="loading">Lade…</div></main>
  <div id="toast" class="toast" hidden></div>
  <div id="lightbox" class="lightbox" hidden>
    <img alt="">
    <button class="lb-btn lb-prev" aria-label="Vorheriges Foto"><svg viewBox="0 0 24 24" class="ic"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button class="lb-btn lb-next" aria-label="Nächstes Foto"><svg viewBox="0 0 24 24" class="ic"><path d="M9 6l6 6-6 6"/></svg></button>
    <span class="lb-count"></span>
  </div>
  <div id="sheet" class="sheet-overlay" hidden><div class="sheet-panel" role="dialog" aria-modal="true"></div></div>
  <script src="app.js"></script>
</body>
</html>
