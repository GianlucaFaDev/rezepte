<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kochbuch</title>
  <meta name="theme-color" content="#2f7d4f">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥕</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/" class="logo"><span class="logo-mark">🥕</span><span>Kochbuch</span></a>
      <nav class="nav" id="nav" hidden>
        <a href="#/" class="nav-link hide-sm">Rezepte</a>
        <button class="nav-link" id="btn-random" title="Zufälliges Rezept">🎲 <span class="hide-sm">Zufall</span></button>
        <a href="#/neu" class="btn btn-primary">+ <span class="hide-sm">Neues Rezept</span></a>
        <div class="user-menu">
          <button class="nav-link user-btn" id="btn-user" aria-haspopup="true" aria-expanded="false" aria-label="Benutzermenü">
            <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
            <span class="user-name hide-sm" id="user-name"></span>
            <span class="user-badge" id="user-badge" hidden></span>
            <svg viewBox="0 0 24 24" class="ic ic-sm"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="menu" id="user-menu" hidden>
            <a href="#/kalender" class="menu-item"><svg viewBox="0 0 24 24" class="ic"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg> Kalender</a>
            <a href="#/kategorien" class="menu-item"><svg viewBox="0 0 24 24" class="ic"><path d="M4 6h16M4 12h16M4 18h10"/></svg> Kategorien verwalten</a>
            <a href="#/benutzer" class="menu-item" id="menu-users" hidden><svg viewBox="0 0 24 24" class="ic"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/></svg> Benutzer <span class="count-badge" id="menu-users-badge" hidden></span></a>
            <div class="menu-storage" id="menu-storage" hidden></div>
            <button class="menu-item" id="btn-logout"><svg viewBox="0 0 24 24" class="ic"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l5-5-5-5M15 12H4"/></svg> Abmelden</button>
          </div>
        </div>
      </nav>
    </div>
  </header>
  <main id="app"><div class="loading">Lade…</div></main>
  <div id="toast" class="toast" hidden></div>
  <div id="lightbox" class="lightbox" hidden><img alt=""></div>
  <div id="sheet" class="sheet-overlay" hidden><div class="sheet-panel" role="dialog" aria-modal="true"></div></div>
  <script src="app.js"></script>
</body>
</html>
